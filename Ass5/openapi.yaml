
openapi: 3.0.3

info:
  title: CampusEats Catalogue Service
  version: "1.0.0"
  description: Manages menu items and availability for CampusEats.

servers:
  - url: http://localhost:8080

paths:

  /items:

    post:
      summary: Create a menu item

      parameters:
        - in: header
          name: Idempotency-Key
          required: false
          description: Prevents duplicate creation when the same request is retried.
          schema:
            type: string

        - in: header
          name: Authorization
          required: true
          description: Bearer authentication token.
          schema:
            type: string

        - in: header
          name: Accept
          required: false
          description: Requested response format.
          schema:
            type: string
            example: application/json

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateItemRequest'

      responses:

        '201':
          description: Item created successfully
          headers:
            Location:
              description: URI of the newly created item.
              schema:
                type: string
            X-RateLimit-Limit:
              description: Maximum requests allowed in the rate-limit window.
              schema:
                type: integer
            X-RateLimit-Remaining:
              description: Requests remaining in the current rate-limit window.
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItemResponse'

        '400':
          description: Malformed request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'

        '401':
          description: Missing or invalid Bearer token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'

        '406':
          description: Requested response format is not supported
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'

        '409':
          description: Resource conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'

        '422':
          description: Domain validation failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'

        '429':
          description: Rate limit exceeded
          headers:
            Retry-After:
              description: Number of seconds to wait before retrying.
              schema:
                type: integer
            X-RateLimit-Limit:
              description: Maximum requests allowed in the rate-limit window.
              schema:
                type: integer
            X-RateLimit-Remaining:
              description: Requests remaining in the current rate-limit window.
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'


    get:
      summary: List menu items with filtering, sorting, and pagination

      parameters:

        - in: query
          name: restaurantId
          required: false
          schema:
            type: integer

        - in: query
          name: sort
          required: false
          schema:
            type: string
            enum:
              - name
              - pricePaise
              - createdAt

        - in: query
          name: order
          required: false
          schema:
            type: string
            enum:
              - asc
              - desc
            default: asc

        - in: query
          name: page
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1

        - in: query
          name: limit
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20

        - in: header
          name: Accept
          required: false
          schema:
            type: string
            example: application/json

      responses:

        '200':
          description: List of menu items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ItemResponse'

        '400':
          description: Invalid query parameter
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'

        '406':
          description: Requested response format is not supported
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'

        '429':
          description: Rate limit exceeded
          headers:
            Retry-After:
              description: Number of seconds to wait before retrying.
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'


  /items/{id}:

    get:
      summary: Retrieve a single menu item

      parameters:

        - in: path
          name: id
          required: true
          schema:
            type: integer

        - in: header
          name: Accept
          required: false
          schema:
            type: string
            example: application/json

        - in: header
          name: If-None-Match
          required: false
          description: Returns 304 when the supplied ETag matches the current resource.
          schema:
            type: string
            example: '"c95d628d00fb1dfa5228ab22c4a7dc14059cab3e5d47bd232a4fa54e0fdc2ec7"'

      responses:

        '200':
          description: Item found
          headers:
            ETag:
              description: Current representation identifier for the item.
              schema:
                type: string
            Cache-Control:
              description: Caching policy for the item representation.
              schema:
                type: string
                example: private, max-age=60
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItemResponse'

        '304':
          description: Item has not changed; no response body is returned.
          headers:
            ETag:
              schema:
                type: string
            Cache-Control:
              schema:
                type: string

        '404':
          description: Item not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'

        '406':
          description: Requested response format is not supported
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'


    options:
      summary: Describe supported methods for a menu item

      parameters:
        - in: header
          name: Origin
          required: false
          schema:
            type: string

        - in: header
          name: Access-Control-Request-Method
          required: false
          schema:
            type: string

        - in: header
          name: Access-Control-Request-Headers
          required: false
          schema:
            type: string

      responses:

        '204':
          description: Supported methods
          headers:
            Allow:
              description: HTTP methods supported by this resource.
              schema:
                type: string
                example: GET, OPTIONS
            Access-Control-Allow-Origin:
              schema:
                type: string
                example: "*"
            Access-Control-Allow-Methods:
              schema:
                type: string
                example: GET, POST, OPTIONS
            Access-Control-Allow-Headers:
              schema:
                type: string
                example: Content-Type, Authorization, Accept, Idempotency-Key, If-None-Match, If-Match


  /items/{id}/availability:

    post:
      summary: Update item availability status

      parameters:

        - in: path
          name: id
          required: true
          schema:
            type: integer

        - in: header
          name: Authorization
          required: true
          description: Bearer authentication token.
          schema:
            type: string

        - in: header
          name: Accept
          required: false
          schema:
            type: string
            example: application/json

        - in: header
          name: If-Match
          required: false
          description: Prevents updating a resource when the supplied ETag is stale.
          schema:
            type: string

        - in: header
          name: Idempotency-Key
          required: false
          description: Client supplied key for safe retry handling.
          schema:
            type: string

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AvailabilityRequest'

      responses:

        '202':
          description: Availability state transition accepted
          content:
            application/json:
              schema:
                type: object
                properties:
                  itemId:
                    type: integer
                  isAvailable:
                    type: boolean

        '400':
          description: Malformed request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'

        '401':
          description: Missing or invalid Bearer token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'

        '404':
          description: Item not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'

        '406':
          description: Requested response format is not supported
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'

        '409':
          description: State conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'

        '412':
          description: If-Match precondition failed because the ETag is stale.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'


components:

  schemas:

    CreateItemRequest:
      type: object
      required:
        - restaurantId
        - name
        - pricePaise
      properties:
        restaurantId:
          type: integer

        name:
          type: string

        pricePaise:
          type: integer
          minimum: 1


    AvailabilityRequest:
      type: object
      required:
        - isAvailable
      properties:
        isAvailable:
          type: boolean


    ItemResponse:
      type: object
      properties:
        id:
          type: integer

        restaurantId:
          type: integer

        name:
          type: string

        pricePaise:
          type: integer

        isAvailable:
          type: boolean

        createdAt:
          type: string
          format: date-time


    Problem:
      type: object
      required:
        - type
        - title
        - status
        - detail
      properties:

        type:
          type: string

        title:
          type: string

        status:
          type: integer

        detail:
          type: string

        errors:
          type: array
          items:
            type: array
            items:
              type: string
