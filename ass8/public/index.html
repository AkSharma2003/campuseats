
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CampusEats Menu Catalogue</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>CampusEats Menu Catalogue</h1>
        <p>Food Menu Management System</p>
    </header>

    <main>

        <!-- LOGIN SECTION -->
        <section class="form-section" id="loginSection">

            <h2>Login to CampusEats</h2>

            <form id="loginForm">

                <label for="email">Email</label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter email"
                    required
                >

                <label for="password">Password</label>

                <input
                    type="password"
                    id="password"
                    placeholder="Enter password"
                    required
                >

                <button type="submit">Login</button>

            </form>

            <p id="loginMessage"></p>

        </section>


        <!-- USER SECTION -->
        <div id="userSection" class="form-section" hidden>

            <p id="userInfo"></p>

            <button type="button" id="logoutBtn">
                Logout
            </button>

        </div>


        <!-- AVAILABLE DISHES -->
        <section class="menu-section" id="menuSection" hidden>

            <div class="heading">

                <h2>Available Dishes</h2>

                <button id="refreshBtn" disabled>
                    Refresh Menu
                </button>

            </div>

            <p id="status">
                Please login to view the menu.
            </p>

            <div id="dishList" class="dish-list"></div>

        </section>


        <!-- ADD NEW DISH -->
        <section class="form-section" id="addSection" hidden>

            <h2>Add a New Dish</h2>

            <form id="dishForm">

                <label for="name">Dish Name</label>

                <input
                    type="text"
                    id="name"
                    placeholder="Enter dish name"
                    required
                >

                <label for="price">Price (₹)</label>

                <input
                    type="number"
                    id="price"
                    placeholder="Enter price"
                    min="0"
                    step="0.01"
                    required
                >

                <label for="available">Availability</label>

                <select id="available">

                    <option value="true">Available</option>

                    <option value="false">Not Available</option>

                </select>

                <button type="submit">
                    Add Dish
                </button>

            </form>

            <p id="message"></p>

        </section>

    </main>


    <!-- FOOTER -->
    <footer>

        <p>
            CampusEats | CS543 Web Services Assignment 9
        </p>

    </footer>


    <!-- JAVASCRIPT -->
    <script src="script.js"></script>

</body>

</html>
